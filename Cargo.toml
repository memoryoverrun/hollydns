[workspace]
resolver = "2"
members = ["libdns", "libresolve", "libruntime"]
default-members = ["stock-bot"]

[profile.release]
debug = true

[profile.bench]
debug = true

[workspace.dependencies]
anyhow = "1.0"
chrono = "0.4"
cron = "0.12.1"
rand = "0.8.5"
tokio = { version = "1.37.0", features = ["full", "tracing"] }
tokio-util = "0.7.11"
tokio-stream = "0.1.15"
console-subscriber = "0.2.0"
once_cell = "1"
log = "0.4"
reqwest = { version = "0.12.3", features = ["gzip", "deflate", "brotli", "default-tls", "native-tls", "charset", "stream", "multipart", "cookies", "socks", "http2"] }
sonic-rs = "0.3"
serde = "1.0.197"
serde_json = "1.0.115"
serde_yaml = "0.9"
phf = "0.11"
sea-orm = { version = "0.12", features = [ "sqlx-mysql", "sqlx-postgres", "runtime-tokio-rustls", "macros", "debug-print" ] }
sea-orm-migration = "^0.12.0"
governor = "0.6.0"
async-trait = "0.1.80"
nonzero_ext = "0.3.0"
influxdb = { version = "0.7.2", features = ["derive"] }
